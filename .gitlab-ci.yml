# .gitlab-ci.yml — PMS mock server CI
# 第一階段:只跑純離線單元測試(不需 Flask 伺服器、不對外發砲)。
# ENV_SWITCH=LOCAL_OFFLINE 確保 real 雲端測試被 @skipif 跳過。

stages:
  - test

variables:
  ENV_SWITCH: "LOCAL_OFFLINE"   # 離網規格比對模式,CI 不發送任何對外請求

offline-unit-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir pytest requests responses
  script:
    - pytest tests_localFullStackClose/test_local_sandbox.py tests_localFullStackClose/test_mock.py tests_localFullStackClose/test_orchestrator.py -v
